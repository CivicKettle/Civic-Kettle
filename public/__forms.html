<!DOCTYPE html><html><head><title>Netlify form definitions</title></head><body>
<form name="founding-org" method="POST" action="/thanks" data-netlify="true" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="founding-org">
  <input name="bot-field">
  <input type="text" name="organization">
  <input type="text" name="name">
  <input type="email" name="email">
  <select name="org_type"><option>Small charity or nonprofit</option></select>
  <select name="volunteers"><option>Under 10</option></select>
  <textarea name="current_process"></textarea>
  <textarea name="biggest_pain"></textarea>
</form>
</body></html>
